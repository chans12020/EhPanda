name: Test
on:
  push:
    branches-ignore:
      - codex/iphone-duo-adaptation
  workflow_dispatch:
env:
   SCHEME_NAME: 'EhPanda'
   DEVELOPER_DIR: /Applications/Xcode_27.1.app
jobs:
  Test:
    runs-on: xcode-27
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone Duo
            os: '27.1'
          - device: iPhone Air
            os: '27.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install iOS 27.1 Platform
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 10
          timeout_minutes: 999
          command: xcodebuild -downloadPlatform iOS
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Check adaptive layout and pagination
        run: ./actions-tool/check-duo-layout.sh
      - name: Run tests
        run: xcodebuild clean test
          -skipMacroValidation
          -scheme ${{ env.SCHEME_NAME }}
          -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.os }}'
