name: Build iPhone Duo IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/iphone-duo-adaptation

permissions:
  contents: read

concurrency:
  group: duo-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive and package IPA
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Check out adapted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check layout and pagination
        run: ./actions-tool/check-duo-layout.sh

      - name: Build unsigned device IPA
        run: |
          mkdir -p build
          ./actions-tool/build-duo-ipa.sh 2>&1 | tee build/ipa-build.log

      - name: Upload IPA and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: EhPanda-Duo-unsigned
          path: |
            build/EhPanda-Duo-unsigned.ipa
            build/EhPanda-Duo-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: EhPanda-Duo-build-log
          path: build/ipa-build.log
          if-no-files-found: ignore
          retention-days: 7
